  - {id: fa1, nome: Financial Advisor I (FA I), grupo: fa, base: 7.5}
  - {id: fa2, nome: Financial Advisor II (FA II), grupo: fa, base: 15}
  - {id: fa3, nome: Financial Advisor III (FA III), grupo: fa, base: 17.5}
  - {id: fa4, nome: Financial Advisor IV (FA IV), grupo: fa, base: 20}
  - {id: p, nome: Partner (P), grupo: partner, base: 24}
  - {id: sp, nome: Senior Partner (SP), grupo: partner, base: 27.5}
  - {id: ap, nome: Associate Partner (AP), grupo: partner, base: 30}

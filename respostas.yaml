- id: e-smnotre
  area: estornos
  parceira: saudemais
  pergunta: 'Saúde Mais: SulAmérica, NotreDame Intermédica, Leader e NotreLife.'
  outras_formas:
  - notredame estorno
  - intermedica estorno
  - fatura nao paga saude
  palavras_chave: saudemais sulamerica notredame intermedica leader notrelife fatura nao paga
  secao: estornos#saudemais
  resposta: |
    <p>Aqui a base é a <strong>fatura não paga</strong>: devolve-se 100% da parcela de agenciamento correspondente.</p>
    <ul><li>Pagou só a 1ª: 100% da 1ª parcela de agenciamento.</li><li>Pagou 1ª e 2ª: 100% da 2ª.</li><li>Pagou de 3 a 5 faturas: 100% da 3ª.</li>
    <li>Zera quando a fatura não paga é a 7ª (SulAmérica) ou a 8ª (NotreDame e Leader). NotreLife tem só as duas primeiras faixas.</li></ul>

- id: e-vv
  area: estornos
  parceira: vilavelha
  pergunta: 'Vila Velha (seguro auto e demais ramos): como é o estorno?'
  outras_formas:
  - seguro auto estorno
  - seguro de carro cancelou
  palavras_chave: vilavelha seguro auto carro ramos comissao antecipada premio a vista parcelado pro rata saldo
  secao: estornos#vilavelha
  resposta: |
    <p>A comissão é paga na emissão, sobre o <strong>prêmio total à vista</strong>, mesmo que o cliente parcele.</p>
    <ul><li>1ª parcela não paga: estorno <strong>integral</strong>.</li><li>Deixou de pagar parcelas seguintes: estorno <strong>proporcional ao saldo não pago</strong>.</li></ul>
    <p>Ex.: seguro em 10 parcelas, cancelado depois da 3ª → estorno de <strong>7/10</strong> da comissão.</p>

- id: e-itau
  area: estornos
  parceira: itau
  pergunta: 'Itaú consórcio (iConquista): como é o estorno?'
  outras_formas:
  - itau cancelou consorcio
  - curva de estorno itau
  palavras_chave: itau iconquista consorcio categoria diamante ouro prata bronze curva 80 parcela alem da curva imovel auto linear reduzida
  secao: estornos#itau
  resposta: |
    <p>Comissão e curva de estorno dependem da <strong>categoria</strong> do escritório (Diamante, Ouro, Prata ou Bronze), do bem (imóvel ou auto) e do tipo de parcela (linear ou reduzida).</p>
    <p>As curvas começam em <strong>80% de estorno</strong> e caem a cada parcela paga. Para não haver estorno, o cliente precisa pagar <strong>uma parcela além da curva</strong> (curva de 6 meses → 7ª parcela).</p>
    <p>Há também a modalidade <strong>Sem Estorno</strong>.</p>

- id: e-itausem
  area: estornos
  parceira: itau
  pergunta: 'Itaú: como funciona a modalidade Sem Estorno?'
  outras_formas:
  - consorcio sem estorno itau
  palavras_chave: itau iconquista semestorno sem estorno modalidade imovel 16x 0,25 auto 10x 0,40 4%
  secao: estornos#itau
  resposta: |
    <p>Comissão de <strong>4%</strong> sem risco de devolução, recebida em mais parcelas:</p>
    <ul><li><strong>Imóvel:</strong> 16 × 0,25%</li><li><strong>Auto:</strong> 10 × 0,40%</li></ul>

- id: e-itaucat
  area: estornos
  parceira: itau
  pergunta: 'Itaú: como é definida a categoria do escritório?'
  outras_formas:
  - categoria diamante itau
  palavras_chave: itau categoria criterios diamante ouro prata bronze cancelamento producao trimestre
  secao: estornos#itau
  resposta: |
    <ul><li><strong>Diamante:</strong> produção acima de R$ 3 mi/mês e cancelamento abaixo de 10%.</li>
    <li><strong>Ouro:</strong> R$ 1 a 3 mi/mês e cancelamento abaixo de 20%.</li>
    <li><strong>Prata:</strong> até R$ 1 mi/mês e cancelamento abaixo de 30%.</li>
    <li><strong>Bronze:</strong> cancelamento acima de 30%.</li></ul><p>Revisão trimestral. A taxa de cancelamento pesa mais que o volume.</p>

- id: e-itauinad
  area: estornos
  parceira: itau
  pergunta: 'Itaú consórcio: cliente com parcelas em atraso.'
  outras_formas:
  - itau 3 parcelas atrasadas
  - cota cancelada itau
  palavras_chave: itau inadimplencia 3 parcelas atraso cota cancelada automaticamente redutor 50 12x 18x
  secao: estornos#itau
  resposta: |
    <p>Com <strong>3 parcelas em atraso</strong>, a cota é cancelada automaticamente. Cota em atraso não gera comissão e, se cancelada, a comissão já paga pode ser estornada.</p>
    <p>Grupos com redutor de 50%: modelo 12x tem estorno; modelo 18x é sem estorno (desde 24/03/2026).</p>

- id: e-cnp
  area: estornos
  parceira: cnp
  pergunta: 'Consórcio XP (CNP): como é o estorno?'
  outras_formas:
  - cnp cancelou
  - estorno consorcio xp
  palavras_chave: cnp xp consorcio categoria diamante ouro prata bronze parcela reduzida cheia estorno 30 40 50 adimplencia 13 mes
  secao: estornos#cnp
  resposta: |
    <p>A categoria do escritório define comissão e estorno (reavaliada a cada trimestre pela adimplência no 13º mês).</p>
    <table class="t"><tr><th>Categoria</th><th>Parcela reduzida</th><th>Parcela cheia</th></tr>
    <tr><td>Diamante</td><td>4% em 12x · sem estorno</td><td>4% em 6x · sem estorno</td></tr>
    <tr><td>Ouro</td><td>4% em 12x · 30% por 12 meses</td><td>4% em 8x · 30% por 8 meses</td></tr>
    <tr><td>Prata</td><td>3,75% em 12x · 40% por 12 meses</td><td>3,5% em 8x · 40% por 8 meses</td></tr>
    <tr><td>Bronze</td><td>3,5% em 12x · 50% por 12 meses</td><td>3% em 8x · 50% por 8 meses</td></tr></table>

- id: e-cnpdesist
  area: estornos
  parceira: cnp
  pergunta: 'CNP: desistência, cota inadimplente e vendas em condição exclusiva.'
  outras_formas:
  - cnp desistencia
  - venda para funcionario cnp
  palavras_chave: cnp desistencia inadimplente vicio comercializacao condicao exclusiva colaboradores assessores dedicados
  secao: estornos#cnp
  resposta: |
    <p>Cota cancelada ou inadimplente não gera comissão; na <strong>desistência</strong>, o estorno é proporcional ao valor pago pelo cliente e compensado nas comissões seguintes. Vício de comercialização comprovado também gera estorno.</p>
    <p>Vendas em condição exclusiva (colaboradores, assessores e dedicados) <strong>não têm comissão</strong>.</p>

- id: e-embracon
  area: estornos
  parceira: embracon
  pergunta: 'Embracon: como é o estorno?'
  outras_formas:
  - embracon cancelou
  - tabela 4x embracon
  - embracon 12x
  palavras_chave: embracon 12x semestorno sem estorno 4x com estorno 0,5 sexta 6 parcela em dia tabelas select parcelinha xp
  secao: estornos#embracon
  resposta: |
    <ul><li>Tabelas <strong>“12x sem estorno”</strong>: comissão de 0,333% ao mês, sem estorno (Imóvel Parcela Reduzida 1x e 12x, Imóvel Parceria Nacional B, Auto Exclusiva XP, Pesados Parcelinha).</li>
    <li>Tabelas <strong>“4x com estorno de 0,5%”</strong>: comissão 1,5% + 1,0% + 1,0% + 0,5%. O consorciado precisa ficar em dia até, no mínimo, a <strong>6ª parcela</strong>; se não, estorno de 0,5% (Select Mais imóvel/auto, Pesados, Serviços, Moto).</li></ul>

- id: e-embfase
  area: estornos
  parceira: embracon
  pergunta: 'Embracon: por que a proposta não pagou comissão?'
  outras_formas:
  - fase da proposta embracon
  - fase 23
  palavras_chave: embracon fase 22 24 44 23 nao paga comissao cota nao alocada
  secao: estornos#embracon
  resposta: |
    <p>Proposta nas fases <strong>22, 24 ou 44</strong> não paga comissão; só a <strong>fase 23</strong> (analisada, sem inconsistência). Cota não alocada, inadimplente, em atraso ou cancelada também não gera comissão.</p>

- id: e-magalu
  area: estornos
  parceira: magalu
  pergunta: 'Consórcio Magalu: como é o estorno?'
  outras_formas:
  - magalu cancelou
  - magalu 6 parcelas
  palavras_chave: magalu consorcio cancelamento ate 6 parcelas 50 comissao funcionarios auto moto eletro imovel caminhao
  secao: estornos#magalu
  resposta: |
    <p>Cancelamento com <strong>até 6 parcelas pagas</strong> estorna <strong>50% da comissão já paga</strong>, em todos os segmentos. A comissão só é paga conforme o cliente paga as parcelas. Plano de funcionários não gera comissão.</p>
    <p>Ex.: 1,9% recebidos sobre R$ 100 mil (R$ 1.900,00) e cancelamento com 4 parcelas → <strong>R$ 950,00</strong>.</p>

- id: e-bb
  area: estornos
  parceira: bb
  pergunta: BB Consórcio tem estorno?
  outras_formas:
  - banco do brasil consorcio estorno
  palavras_chave: bb consorcio banco do brasil semestorno sem estorno reclamacao procedente devolucao 75 dias conformidade
  secao: estornos#bb
  resposta: |
    <p><strong>Não por desistência.</strong> A exceção: reclamação procedente com devolução ao consorciado estorna todas as comissões do contrato.</p>
    <p>Atenção ao prazo de conformidade: documentação entregue após <strong>75 dias</strong> da alocação faz a comissão deixar de ser devida.</p>

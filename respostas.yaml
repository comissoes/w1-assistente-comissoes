    <table class="t"><tr><th>Permanência</th><th>Estorno</th></tr>
    <tr><td>&lt; 1 mês</td><td>100%</td></tr><tr><td>1 a 2</td><td>91,67%</td></tr><tr><td>2 a 3</td><td>83,33%</td></tr><tr><td>3 a 4</td><td>75,00%</td></tr><tr><td>4 a 5</td><td>66,68%</td></tr><tr><td>5 a 6</td><td>58,35%</td></tr><tr><td>6 a 7</td><td>50,00%</td></tr><tr><td>7 a 8</td><td>41,65%</td></tr><tr><td>8 a 9</td><td>33,32%</td></tr><tr><td>9 a 10</td><td>25,00%</td></tr><tr><td>10 a 11</td><td>16,67%</td></tr><tr><td>11 a 12</td><td>8,33%</td></tr><tr><td>12 ou mais</td><td>0%</td></tr></table>
    <p>12ª parcela + 12 meses = contrato livre no <strong>mês 24</strong>.</p>

- id: e-icatunovo
  area: estornos
  parceira: icatu
  pergunta: 'Icatu Horizonte guia out/2025: tabela de estorno (18 meses).'
  outras_formas:
  - horizonte novo
  - horizonte 18 meses
  - horizonte demais temporario vitalicio
  palavras_chave: icatu horizonte novo guia out 2025 outubro demais temporario vitalicio 18 meses 90 80 70 60 50
  secao: estornos#icatu
  resposta: |
    <p>Vale para Demais, Temporário, Vitalício 5 e Vitalício 10. Cada parcela de agenciamento fica sujeita a estorno só por <strong>6 meses</strong>:</p>
    <table class="t"><tr><th>Permanência</th><th>Estorno</th></tr>
    <tr><td>&lt; 1 mês</td><td>100%</td></tr><tr><td>1 a 2</td><td>90%</td></tr><tr><td>2 a 3</td><td>80%</td></tr><tr><td>3 a 4</td><td>70%</td></tr><tr><td>4 a 5</td><td>60%</td></tr><tr><td>5 a 6</td><td>50%</td></tr><tr><td>6 ou mais</td><td>0%</td></tr></table>
    <p>12ª parcela + 6 meses = contrato livre no <strong>mês 18</strong>.</p>

- id: e-icatuess
  area: estornos
  parceira: icatu
  pergunta: 'Icatu Essencial: como é o estorno?'
  outras_formas:
  - essencial 12 meses
  - essencial plataformista estorno
  palavras_chave: icatu essencial plataformista 12 meses primeira mensalidade agenciamento modulo 200 7 8 9
  secao: estornos#icatu
  resposta: |
    <p>Agenciamento pago na 1ª mensalidade. Estorno proporcional se o cliente não completar <strong>12 meses</strong>, caindo 1/12 por mês (100%, 91,67%, 83,33%, 75%, 66,67%, 58,33%, 50%, 41,67%, 33,33%, 25%, 16,67%, 8,33%, 0%).</p>
    <p><strong>Exemplo:</strong> agenciamento de R$ 300,00, cliente pagou 4 mensalidades → 66,67% = <strong>R$ 200,00</strong>. Com 13 pagas, sem estorno.</p>
    <p>Módulos de 200% (7, 8 e 9): agenciamento em duas parcelas de 100% (1ª e 2ª mensalidade), cada uma com sua tabela.</p>

- id: e-icatuversao
  area: estornos
  parceira: icatu
  pergunta: 'Icatu: qual tabela vale para o meu cliente?'
  outras_formas:
  - como saber se e guia antigo ou novo
  - versao do produto icatu
  palavras_chave: icatu qual tabela vale versao guia data venda horizonte demais antigo novo identificar
  secao: estornos#icatu
  resposta: |
    <p>Depende de <strong>quando a apólice foi vendida</strong>. Horizonte vendido pelo guia antigo (até set/2025) segue a tabela de 12 meses por parcela. No guia de out/2025, o Horizonte passou a ser vendido nas opções <em>Demais</em>, <em>Temporário</em>, <em>Vitalício 5</em> e <em>Vitalício 10</em>, todas com a tabela nova (6 meses por parcela).</p>
    <p>Essencial e Essencial Plataformista seguem a tabela do Essencial.</p>

- id: e-icatuexemplo
  area: estornos
  parceira: icatu
  pergunta: 'Icatu: exemplo de cliente que pagou 8 parcelas e cancelou.'
  outras_formas:
  - exemplo de calculo icatu
  - cancelou com 8 parcelas
  palavras_chave: icatu exemplo calculo horizonte 8 parcelas pagas cancelou 500 350
  secao: estornos#icatu
  resposta: |
    <p>Agenciamento de R$ 100,00 por parcela. A 8ª parcela ficou 1 mês, a 7ª ficou 2 meses… a 1ª ficou 8 meses.</p>
    <ul><li><strong>Guia antigo (até set/2025):</strong> 8 lançamentos de estorno, somando <strong>R$ 500,00</strong> dos R$ 800,00 recebidos.</li>
    <li><strong>Guia out/2025:</strong> só as 5 últimas parcelas são estornadas (90+80+70+60+50), somando <strong>R$ 350,00</strong>.</li></ul>

- id: e-icatuconferir
  area: estornos
  parceira: icatu
  pergunta: Como confiro um estorno da Icatu?
  outras_formas:
  - passo a passo estorno icatu
  - formula icatu
  palavras_chave: icatu conferir calcular passo a passo formula ultima parcela mantida permanencia
  secao: estornos#icatu
  resposta: |
    <ol><li>Identifique a <strong>última parcela paga e mantida</strong> pelo cliente.</li>
    <li>Para cada parcela que pagou agenciamento: permanência = <strong>última parcela mantida − nº da parcela + 1</strong>.</li>
    <li>Busque o percentual na tabela da versão do produto e multiplique pelo <strong>agenciamento daquela parcela</strong>.</li>
    <li>Some as parcelas. Permanência fora da tabela = 0%.</li></ol>
    <p>Ou use a calculadora da Central de Estornos.</p>

- id: e-icatuvarios
  area: estornos
  parceira: icatu
  pergunta: Por que recebi vários estornos da Icatu no mesmo mês para o mesmo cliente?
  outras_formas:
  - varios lancamentos icatu
  - muitos estornos icatu
  palavras_chave: icatu varios lancamentos estornos mesmo mes mesmo cliente
  secao: estornos#icatu
  resposta: |
    <p>Porque o agenciamento foi pago em várias parcelas, e cada parcela tem sua própria permanência. Um cancelamento gera <strong>um lançamento por parcela</strong> ainda dentro do prazo, cada um com seu percentual.</p>

- id: e-icatu1ano
  area: estornos
  parceira: icatu
  pergunta: O cliente Icatu cancelou depois de 1 ano. Ainda tem estorno?
  outras_formas:
  - icatu 13 meses
  - cancelou depois de 12 meses
  palavras_chave: icatu cancelou depois de um ano 13 meses 12 meses ainda tem estorno
  secao: estornos#icatu
  resposta: |
    <p><strong>Horizonte: sim.</strong> Como o agenciamento é pago até a 12ª parcela, as últimas ainda estão no prazo: até o mês 24 (guia antigo) ou 18 (guia out/2025).</p>
    <p><strong>Essencial: não</strong>, após 12 meses não há estorno.</p>

- id: e-icatu100
  area: estornos
  parceira: icatu
  pergunta: Veio estorno de 100% em uma parcela da Icatu. Está certo?
  outras_formas:
  - estorno integral icatu
  palavras_chave: icatu 100% integral parcela menos de um mes
  secao: estornos#icatu
  resposta: |
    <p>Só quando a permanência daquela parcela é <strong>menor que 1 mês</strong> ou quando o pagamento da parcela foi devolvido. Se a parcela ficou 1 mês ou mais, o correto é 91,67% (guia antigo) ou 90% (guia out/2025).</p>

- id: e-icatu24
  area: estornos
  parceira: icatu
  pergunta: O guia da Icatu fala em 24 meses, mas a tabela vai só até 12. Qual vale?
  outras_formas:
  - 24 ou 12 meses icatu
  palavras_chave: icatu 24 meses 12 meses texto guia horizonte diferenca
  secao: estornos#icatu
  resposta: |
    <p>As duas se completam. A tabela vale para <strong>cada parcela</strong> (12 meses a partir dela). Como o agenciamento vai até a 12ª parcela, o contrato só fica totalmente livre no mês 24. No guia out/2025 a lógica é a mesma com 6 meses por parcela: livre no mês 18.</p>

- id: e-icatupme
  area: estornos
  parceira: icatu
  pergunta: 'Icatu PME e Vida em Grupo: tem estorno?'
  outras_formas:
  - vida em grupo icatu
  palavras_chave: icatu pme vidagrupo vida em grupo empresarial reembolso proporcional estipulante
  secao: estornos#icatu
  resposta: |
    <p>Agenciamento de 100% do prêmio da 1ª fatura. Se a apólice ou o segurado for cancelado antes do fim da vigência prevista, o agenciamento é <strong>reembolsado proporcionalmente</strong>. A proposta comercial não traz tabela de percentuais.</p>

- id: e-icatucorret
  area: estornos
  parceira: icatu
  pergunta: Icatu estorna a corretagem? E na co-corretagem?
  outras_formas:
  - co-corretagem icatu
  palavras_chave: icatu corretagem co-corretagem cocorretagem estorna
  secao: estornos#icatu
  resposta: |
    <p>Os guias não preveem estorno de corretagem. Quando o pagamento de uma parcela do cliente é desfeito, a Icatu reverte a comissão daquela parcela inteira (agenciamento e corretagem).</p>
    <p>Em co-corretagem, a Icatu paga o co-corretor diretamente, sem passar pela W1.</p>

- id: e-mag
  area: estornos
  parceira: mag
  pergunta: Como funciona o estorno da MAG?
  outras_formas:
  - regra de estorno mag
  - mag cancelou
  - mongeral estorno
  palavras_chave: mag estorno angariacao contribuicoes pagas grupos politica v6 regra
  secao: estornos#mag
  resposta: |
    <p>A MAG divide os produtos de vida em grupos, cada um com sua tabela (Política de Estorno v6, vigência 10/03/2025). O estorno incide sobre a <strong>angariação</strong> e é contado pelo <strong>número de contribuições pagas</strong>.</p>
    <ul><li><strong>Coberturas de risco e riders:</strong> livre a partir da 7ª contribuição.</li>
    <li><strong>Whole Life Integral, Dinâmico e Sucessão:</strong> livre a partir da 13ª.</li>
    <li>VIR/Whole Life Plus, Private Solutions, Empresariais e Talent/Partner têm regras próprias.</li></ul>

- id: e-magrisco
  area: estornos
  parceira: mag
  pergunta: 'MAG coberturas de risco e riders (Grupo A): tabela de estorno.'
  outras_formas:
  - mag dit dih estorno
  - mag doencas graves estorno
  - mag 7 parcela
  palavras_chave: mag risco grupo a riders coberturas dit dih ipa doencas graves saf morte acidente cirurgias reparticao capitalizacao 83,33 66,67
  secao: estornos#mag
  resposta: |
    <p>Angariação paga na 1ª parcela.</p>
    <table class="t"><tr><th>Contribuições pagas</th><th>Estorno</th></tr>
    <tr><td>0 ou 1</td><td>100%</td></tr><tr><td>2</td><td>83,33%</td></tr><tr><td>3</td><td>66,67%</td></tr><tr><td>4</td><td>50%</td></tr><tr><td>5</td><td>33,33%</td></tr><tr><td>6</td><td>16,67%</td></tr><tr><td>7 ou mais</td><td>0%</td></tr></table>
    <p><strong>Exemplo:</strong> angariação de R$ 300,00 e 3 contribuições pagas → 66,67% = <strong>R$ 200,00</strong>.</p>

- id: e-magwl
  area: estornos
  parceira: mag
  pergunta: 'MAG Whole Life Integral, Dinâmico e Sucessão: tabela de estorno.'
  outras_formas:
  - mag whole life estorno
  - wholelife mag
  palavras_chave: mag wholelife whole life integral dinamico sucessao 12 parcelas 90 80 70 60 13 contribuicao
  secao: estornos#mag
  resposta: |
    <p>Angariação paga nas 12 primeiras parcelas. No cancelamento ou redução antes da 12ª, o percentual vale para <strong>toda a angariação já paga</strong>.</p>
    <table class="t"><tr><th>Parcelas pagas</th><th>Estorno</th></tr>
    <tr><td>0 a 2</td><td>100%</td></tr><tr><td>3</td><td>90%</td></tr><tr><td>4</td><td>80%</td></tr><tr><td>5</td><td>70%</td></tr><tr><td>6</td><td>60%</td></tr><tr><td>7</td><td>50%</td></tr><tr><td>8</td><td>40%</td></tr><tr><td>9</td><td>30%</td></tr><tr><td>10</td><td>20%</td></tr><tr><td>11</td><td>10%</td></tr><tr><td>12</td><td>5%</td></tr></table>
    <p><strong>Exemplo:</strong> R$ 200,00 em cada uma das 5 parcelas pagas (R$ 1.000,00) → 70% = <strong>R$ 700,00</strong>.</p>

- id: e-magvir
  area: estornos
  parceira: mag
  pergunta: 'MAG Vida Inteira Resgatável (VIR) e Whole Life Plus: estorno.'
  outras_formas:
  - vir mag
  - whole life plus
  palavras_chave: mag vir vida inteira resgatavel wholelife plus carteira 17 8 4 contribuicoes
  secao: estornos#mag
  resposta: |
    <p>Regra desde 11/06/2018. Até 4 contribuições pagas, estorna <strong>100% da angariação e da carteira</strong>. Com 5 pagas, 17% da angariação; com 6, 8%.</p>
    <p>Redução de capital nos 6 primeiros meses estorna na proporção da redução.</p>

- id: e-magprivate
  area: estornos
  parceira: mag
  pergunta: 'MAG Private Solutions: estorno.'
  outras_formas:
  - term life mag
  - planos 563 579 677 678
  palavras_chave: mag private solutions 563 579 677 678 term life wholelife 2014 8,33
  secao: estornos#mag
  resposta: |
    <ul><li><strong>Planos 563 e 579:</strong> cancelamento nos 12 primeiros meses estorna toda a comissão paga no período.</li>
    <li><strong>Planos 677 e 678 (Whole Life e Term Life 2014):</strong> 0 pagas = 100%, depois cai 8,33 p.p. por contribuição (1 = 91,67% … 11 = 8,33%) até 0% com 12 pagas.</li></ul>

- id: e-magemp
  area: estornos
  parceira: mag
  pergunta: 'MAG Empresariais e VG Cotado (Grupo D): estorno.'
  outras_formas:
  - mag empresarial
  - vida em grupo mag
  palavras_chave: mag empresarial empresariais vg cotado grupo d pro rata exclusao segurados vidagrupo
  secao: estornos#mag
  resposta: |
    <p>Proporcional ao tempo que faltava: <strong>(angariação paga ÷ prazo do contrato) × meses restantes</strong>. Vale para cancelamento ou exclusão de segurados.</p>
    <p>Ex.: R$ 1.200,00 de angariação, contrato de 12 meses, cancelado no 4º mês → 1.200 ÷ 12 × 8 = <strong>R$ 800,00</strong>.</p>

- id: e-magtalent
  area: estornos
  parceira: mag
  pergunta: 'MAG Talent e Partner (Grupo F): estorno.'
  outras_formas:
  - talent mag
  - partner mag
  palavras_chave: mag talent partner grupo f capital medio 2 milhoes 36 meses
  secao: estornos#mag
  resposta: |
    <p>Nos 12 primeiros meses, regra do Grupo A. Do 13º ao 36º mês, se a saída de segurados derrubar o capital médio do convênio abaixo de <strong>R$ 2 milhões</strong>, estorna-se toda a comissão dos 12 primeiros meses da proposta que causou a redução.</p>

- id: e-maggerais
  area: estornos
  parceira: mag
  pergunta: 'MAG: troca de proposta, reativação e outras regras gerais.'
  outras_formas:
  - mag nova proposta
  - cliente trocou de proposta mag
  - mag reativou
  palavras_chave: mag regras gerais 6 meses nova proposta substituicao troca reativacao devolucao contribuicao dobro
  secao: estornos#mag
  resposta: |
    <ul><li><strong>Troca de proposta:</strong> cancelou e contratou outra em até 6 meses → estorna-se a angariação da cancelada na carteira de quem vendeu a nova, limitado à nova angariação.</li>
    <li><strong>Sem estorno em dobro:</strong> nova proposta em até 6 meses de um cancelamento já estornado não gera novo estorno.</li>
    <li><strong>Devolução de contribuição:</strong> estorna também a carteira correspondente.</li>
    <li><strong>Reativação:</strong> reativou e quitou as 6 primeiras parcelas → a MAG devolve o estorno.</li></ul>

- id: e-magcarteira
  area: estornos
  parceira: mag
  pergunta: Recebi estorno de carteira da MAG, não só de angariação. Por quê?
  outras_formas:
  - mag estornou carteira
  palavras_chave: mag estorno carteira devolucao contribuicao vir
  secao: estornos#mag
  resposta: |
    <p>Acontece quando a MAG <strong>devolve contribuição</strong> ao cliente (a carteira daquela contribuição é revertida) e nos produtos <strong>VIR e Whole Life Plus</strong> com até 4 contribuições pagas.</p>

- id: e-magreduz
  area: estornos
  parceira: mag
  pergunta: O cliente MAG reduziu a contribuição. Tem estorno?
  outras_formas:
  - reducao de capital mag
  - diminuiu o seguro mag
  palavras_chave: mag cliente reduziu reducao contribuicao capital diminuiu
  secao: estornos#mag
  resposta: |
    <p>Sim. Coberturas de risco: redução até a 6ª parcela segue a tabela do Grupo A. Whole Life Integral/Dinâmico/Sucessão: redução antes da 12ª segue a tabela de 100% a 5%. VIR e Whole Life Plus: estorno na proporção da redução de capital.</p>

- id: e-sula
  area: estornos
  parceira: sulamerica
  pergunta: 'SulAmérica Previdência: como funciona o estorno?'
  outras_formas:
  - estorno previdencia
  - sulamerica 36 meses
  - pgbl vgbl estorno
  palavras_chave: sulamerica previdencia agenciamento 70 36 meses 2,77 1/36 contribuicao nao paga
  secao: estornos#sulamerica
  resposta: |
    <p>O agenciamento (70% da 1ª parcela) é pago de uma vez, mas o participante precisa contribuir por pelo menos <strong>36 meses</strong>. Cada contribuição mensal não paga estorna <strong>2,77% (1/36)</strong> do agenciamento recebido.</p>
    <p>Ex.: agenciamento de R$ 1.000,00 e 3 contribuições não pagas → 8,31% = <strong>R$ 83,10</strong>.</p>

- id: e-sulasusp
  area: estornos
  parceira: sulamerica
  pergunta: 'SulAmérica: o que acontece com 3 parcelas inadimplentes?'
  outras_formas:
  - cobranca suspensa sulamerica
  palavras_chave: sulamerica suspensao 3 parcelas inadimplentes cobranca suspensa de uma vez
  secao: estornos#sulamerica
  resposta: |
    <p>Com 3 parcelas inadimplentes seguidas, ou 3 não seguidas em 12 meses, a cobrança fica <strong>suspensa</strong>. Nesse momento, todo o estorno ainda devido é cobrado de uma só vez.</p>

- id: e-sulaparcel
  area: estornos
  parceira: sulamerica
  pergunta: 'SulAmérica: o estorno é cobrado à vista ou parcelado?'
  outras_formas:
  - parcelamento do estorno
  palavras_chave: sulamerica parcelamento estorno 500 2000 4x 6x a vista cobrado
  secao: estornos#sulamerica
  resposta: |
    <table class="t"><tr><th>Valor do estorno</th><th>Forma</th></tr><tr><td>Até R$ 500,00</td><td>À vista</td></tr><tr><td>R$ 500,01 a R$ 2.000,00</td><td>4x</td></tr><tr><td>A partir de R$ 2.000,01</td><td>6x</td></tr></table>

- id: e-sularesgate
  area: estornos
  parceira: sulamerica
  pergunta: 'SulAmérica: resgate, aporte ou portabilidade geram estorno?'
  outras_formas:
  - cliente resgatou previdencia
  - portabilidade previdencia estorno
  - portou o plano
  palavras_chave: sulamerica resgate aporte esporadico portabilidade saida entrada especialista prestige
  secao: estornos#sulamerica
  resposta: |
    <p>Resgate ou portabilidade de valor que gerou comissão: <strong>2,77% por mês</strong> que faltava até o 36º, proporcional ao valor resgatado.</p>
    <p>Ex.: comissão de R$ 500,00 sobre um aporte resgatado inteiro no 10º mês → 26 × 2,77% = 72,02% = <strong>R$ 360,10</strong>.</p>
    <p>Portabilidade de <strong>entrada</strong> só gera estorno no produto <strong>Especialista</strong>; no padrão e no Prestige, não.</p>

- id: e-sulaoutros
  area: estornos
  parceira: sulamerica
  pergunta: 'SulAmérica: redução de contribuição, troca de corretor e risco.'
  outras_formas:
  - recusa ipca sulamerica
  - troca de corretor previdencia
  palavras_chave: sulamerica reducao contribuicao ipca reajuste troca corretor carencia risco 30 vitalicio recuperacao
  secao: estornos#sulamerica
  resposta: |
    <ul><li>Redução da contribuição ou recusa do reajuste pelo IPCA: estorno proporcional ao valor reduzido.</li>
    <li>Cliente volta a pagar as atrasadas e segue em dia: o estorno é devolvido.</li>
    <li>Troca de corretor na carência: o antigo é estornado proporcionalmente e o novo recebe a parte restante.</li>
    <li>Risco (30% vitalício): sem agenciamento e sem estorno.</li></ul>

- id: e-pru
  area: estornos
  parceira: prudential
  pergunta: 'Prudential: como funciona o recapture (estorno)?'
  outras_formas:
  - recapture
  - prudential cancelou
  palavras_chave: prudential recapture apolice cobertura 50 30 15 ano vigencia 4 ano
  secao: estornos#prudential
  resposta: |
    <p>Quando uma apólice ou cobertura é cancelada, a Prudential gera o <strong>recapture</strong> sobre toda a comissão paga referente a ela:</p>
    <table class="t"><tr><th>Cancelamento no</th><th>Estorno</th></tr><tr><td>1º ano</td><td>50%</td></tr><tr><td>2º ano</td><td>30%</td></tr><tr><td>3º ano</td><td>15%</td></tr><tr><td>4º ano em diante</td><td>0%</td></tr></table>
    <p>Ex.: R$ 4.000,00 recebidos e cancelamento no 2º ano → <strong>R$ 1.200,00</strong>. Cancelar só um adicional estorna apenas aquela cobertura.</p>

- id: e-amil
  area: estornos
  parceira: amil
  pergunta: 'Amil médico PME e PJ: como é o estorno?'
  outras_formas:
  - amil cancelou
  - plano de saude amil estorno
  palavras_chave: amil pme pj medico coletivo 2 a 99 vidas 100 vidas implantacao 01/08/2026 12 meses saude
  secao: estornos#amil
  resposta: |
    <p>Vale para planos <strong>médicos</strong> coletivos PME (2 a 99 vidas) e PJ (100+ vidas) implantados a partir de <strong>01/08/2026</strong> e cancelados em até 12 meses. Incide sobre o <strong>total das comissões pagas</strong>. Odontológico e contratos anteriores não entram.</p>
    <table class="t"><tr><th>Parcelas pagas</th><th>1–3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th><th>11</th><th>12</th></tr><tr><td>Estorno</td><td>100%</td><td>83%</td><td>79%</td><td>75%</td><td>60%</td><td>50%</td><td>45%</td><td>40%</td><td>35%</td><td>30%</td></tr></table>
    <p>Ex.: R$ 3.000,00 em 5 parcelas e cancelamento → 79% = <strong>R$ 2.370,00</strong>.</p>

- id: e-sm
  area: estornos
  parceira: saudemais
  pergunta: 'Saúde Mais: como é o estorno dos planos de saúde?'
  outras_formas:
  - saude mais cancelou
  - corretora saude mais estorno
  palavras_chave: saudemais saude bradesco omint sulamerica amil notredame 7 parcela 90 dias adesao individual familiar kipp qsaude operadora
  secao: estornos#saudemais
  resposta: |
    <p>Cada operadora tem a sua tabela. Regras gerais da grade:</p>
    <ul><li><strong>Bradesco, Omint, SulAmérica, Amil e NotreDame</strong> estornam 100% de propostas não confirmadas até a 7ª parcela.</li>
    <li>Planos <strong>Adesão, Individual e Familiar</strong>: o cliente precisa ficar pelo menos <strong>90 dias</strong> para não haver estorno.</li>
    <li>Kipp e QSaúde têm tabela específica.</li></ul>

